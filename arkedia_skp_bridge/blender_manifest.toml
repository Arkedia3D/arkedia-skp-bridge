schema_version = "1.0.0"

id = "arkedia_skp_bridge"
version = "0.3.1"
name = "Arkedia SKP Bridge"
tagline = "Import/export SketchUp (.skp) pour le flux scan vers CAO/BIM"
maintainer = "ARKEDIA 3D <contact@arkedia3d.ci>"
website = "https://www.arkedia3d.ci"
type = "add-on"

tags = ["Import-Export"]

blender_version_min = "5.1.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

# Les roues compilées (shapely, mapbox_earcut) sont celles de Windows 64 bits pour Python 3.13,
# la version embarquée dans Blender 5.1 et 5.2 (testé sur 5.2.3 LTS). Autre système : voir le README.
platforms = ["windows-x64"]

wheels = [
  "./wheels/openskp-1.4.0-py3-none-any.whl",
  "./wheels/mapbox_earcut-2.1.0-cp313-cp313-win_amd64.whl",
  "./wheels/shapely-2.1.2-cp313-cp313-win_amd64.whl",
  "./wheels/defusedxml-0.7.1-py2.py3-none-any.whl",
]

[permissions]
files = "Lire le fichier .skp importé, écrire le fichier .skp exporté"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.zip",
]
